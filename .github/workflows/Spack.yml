# This is a CI workflow for the ufs-weather-model repository that builds the
# modified UWM in a given PR with Spack.
#
# Alex Richert, Mar 2025

name: Spack
on: [push,pull_request,workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Spack:
    strategy:
      matrix:
        # See ci/package.py for variant definitions.
        config:
        - {
            os: "ubuntu-24.04",
            app: "S2SWA",
            ccpp_suites: "FV3_GFS_v17_coupled_p8,FV3_GFS_v17_coupled_p8_ugwpv1",
            other-variants: ' +debug ^esmf@8.8.0',
          }
        - {
            os: "ubuntu-24.04",
            app: "ATM",
            ccpp_suites: "FV3_GFS_v16,FV3_GFS_v16_flake,FV3_GFS_v16_ras,FV3_GFS_v17_p8,FV3_GFS_v17_p8_ugwpv1",
            other-variants: ' ^esmf@8.8.0',
          }

    runs-on: ${{ matrix.config.os }}
    permissions:
      # For repo-level build caching by NOAA-EMC/ci-test-spack-package action
      actions: write

    steps:

    - name: "Install dependencies with APT"
      shell: bash
      run: |
        sudo mv /usr/local /usr/local_mv # relocate so CMake doesn't pick up on bad libraries
        sudo apt install libopenmpi-dev openmpi-bin cmake

    - name: "Build Spack package"
      uses: NOAA-EMC/ci-test-spack-package@386c09d0e613bf0c5ea3e45dbdf0e9001c13a3b6
      with:
        package-name: ufs-weather-model
        # ufs-weather-model Spack recipe variants, plus additional package constraints:
        package-variants: app=${{ matrix.config.app }} ccpp_suites=${{ matrix.config.ccpp_suites }} ${{ matrix.config.other-variants }}
        custom-recipe: ci/package.py
        spack-compiler: gcc@13
        spack-test-flag: '' # disable 'make test' for Spack
        use-common-build-cache: true
        repo-cache-key-suffix: ${{ matrix.config.os }}-1 # Update to create and use a fresh cache
        save-repo-cache: ${{ matrix.config.app == 'S2SWA' }} # Only need to save cache from one job
        # Set to save to a different cache key than the restored one (in order to add new packages etc.).
        #  Be sure to unset it after a new cache is generated or a new one will be created each time!
        repo-save-key-suffix: ''
        # Add verbose to see compiler warnings in the console
        spack-install-flags: -v

    - name: "Upload Spack Build Logs"
      if: always() # Run this even if the build fails
      uses: actions/upload-artifact@v4
      with:
        name: spack-build-logs-${{ matrix.config.app }}
        path: |
          **/spack-build-out.txt
          **/spack-build-env.txt
          **/spack-configure-args.txt

  # The recipe-check job validates the Spack recipe by making sure each CMake
  # build option is represented. If this check fails due to the addition of a
  # new CMake option, ci/package.py should be updated in order to make that
  # new build option configurable through Spack.
  recipe-check:

    runs-on: ubuntu-24.04

    steps:
    
    - name: recipe-check
      uses: NOAA-EMC/ci-check-spack-recipe@develop
      with:
        recipe-file: package/spack/package.py
        cmakelists-txt: package/CMakeLists.txt

 # -------------------------------------------------------------------------
  # NEW JOB: Parse logs from the matrix and post GitHub PR comments
  # -------------------------------------------------------------------------
  reviewdog-warnings:
    name: Check Compiler Warnings
    runs-on: ubuntu-latest
    needs: [Spack]
    # success() || failure() ensures it runs if Spack fails, but safely skips if you cancel the workflow
    if: success() || failure() 
    
    permissions:
      contents: read
      pull-requests: write
      checks: write # REQUIRED for the github-check reporter

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Download All Spack Build Logs
        uses: actions/download-artifact@v4
        with:
          pattern: spack-build-logs-*
          # Note: merge-multiple is removed. Logs will safely stay in their own subfolders.
          path: ./spack-logs

      - name: Debug Downloaded Artifacts
        run: |
          echo "=== WHAT FILES DID WE DOWNLOAD? ==="
          find ./spack-logs -type f
          
      - name: Run Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Stitch and clean the logs, saving them to a temporary file
          find ./spack-logs -type f -name "*build-out*" -exec cat {} + | \
          awk '/^\/.*:[0-9]+:([0-9]+:)?/ { loc=$1 } /^[Ww]arning:/ { if(loc!="") { print loc " " $0; loc="" } }' | \
          sed 's|.*/spack-devpkg-ufs-weather-model/||' > cleaned_warnings.txt

          # 2. Generate the full "Checks" tab summary (Passive, no failing)
          cat cleaned_warnings.txt | reviewdog \
            -name="Legacy Warnings Summary" \
            -reporter=github-check \
            -level=warning \
            -fail-on-error=false \
            -efm="%f:%l:%c: Warning: %m" \
            -efm="%f:%l:%c: warning: %m" \
            -efm="%f:%l: Warning: %m" \
            -efm="%f:%l: warning: %m"

          # 3. Post inline PR comments for NEW warnings (Active, fails build)
          cat cleaned_warnings.txt | reviewdog \
            -name="New PR Warnings" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-on-error=true \
            -level=warning \
            -efm="%f:%l:%c: Warning: %m" \
            -efm="%f:%l:%c: warning: %m" \
            -efm="%f:%l: Warning: %m" \
            -efm="%f:%l: warning: %m"
