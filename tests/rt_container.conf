# rt_container.conf — UFS-WM container regression test configuration
#
# Header line 1: RT_COMPILER | CONTAINER_IMG | BIND_DIRS
#   RT_COMPILER   — compiler toolchain inside the container (intel or gnu)
#   CONTAINER_IMG — absolute path to the .sif container image on the host
#   BIND_DIRS     — comma-separated host filesystems to bind-mount into container
#
# Header line 2: TPN | SCHEDULER | USE_ROCOTO | ACCNR | PARTITION | QUEUE
#   TPN           — MPI tasks per node on the host scheduler
#   SCHEDULER     — host job scheduler: slurm or pbs
#   USE_ROCOTO    — true or false (if true, jobs run via rocoto workflow)
#   ACCNR         — scheduler account/project name
#   PARTITION     — SLURM partition (leave blank for PBS)
#   QUEUE         — SLURM QOS / PBS queue name
#
# Header lines 3-5: DISKNM / INPUTDATA_ROOT / RUNDIR_ROOT  (one path per line)
#   DISKNM        — path to the RT baseline data on the host filesystem
#   INPUTDATA_ROOT — input data for the RTs on the host system
#   RUNDIR_ROOT   — top-level runtime directory for test runs
#
# After the three header lines, list compile configurations and their tests:
#   Configuration line: compile_id | MAKE_OPT  (presence of | marks a compile block)
#   Case line:          test_case_name         (single entry — no pipe character)
#   Blank or comment lines between sections are ignored.
#
# Users must prepare before running:
#   ./modulefiles/ufs_container.<compiler>.lua   (inside-container build module)
#   ./modulefiles/ufs_container.runtime.lua      (host-side runtime module)
# and review/adapt:
#   ./tests/fv3_conf/compile_slurm.IN_container  (or compile_qsub.IN_container)
#   ./tests/fv3_conf/fv3_slurm.IN_container      (or fv3_qsub.IN_container)

